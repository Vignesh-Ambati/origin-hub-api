# =====================================================================
#  origin-hub-api - project metadata, dependencies, and tooling config
#
#  This file is the single source of truth for:
#    - what Python version the project runs on
#    - what packages are installed at runtime vs. at development time
#    - how the project is built, tested, and packaged
#
#  Production hosts install with:   pip install .
#  Development hosts install with:  pip install -e ".[dev]"
#  CI installs with:                pip install ".[dev,test]"
# =====================================================================


# ---------------------------------------------------------------------
#  Build System
#  Pinned to a known-good setuptools. Floating the build backend means
#  a future setuptools release can silently change how your wheel is
#  assembled, which is exactly the kind of thing that breaks deploys
#  at 3 a.m. The <70 upper bound is deliberate: setuptools 70+ changed
#  some package-discovery defaults that would require a config review.
# ---------------------------------------------------------------------
[build-system]
requires = ["setuptools>=69.0,<70.0", "wheel"]
build-backend = "setuptools.build_meta"


# ---------------------------------------------------------------------
#  Project Metadata
#  Everything a package index, a vulnerability scanner, or an operator
#  needs to know about this artifact without reading the source.
# ---------------------------------------------------------------------
[project]
name = "origin-hub-api"
version = "0.1.0"
description = "Backend REST API for the Origin Hub application"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Proprietary" }
authors = [
    { name = "Origin Hub Team", email = "engineering@yourcompany.com" },
]
keywords = ["fastapi", "rest", "api", "origin-hub"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]

# ---------------------------------------------------------------------
#  Runtime Dependencies
#
#  These are installed on every production host. They are constrained
#  with BOTH a lower and an upper bound:
#
#    lower bound  = the oldest version we have actually tested
#    upper bound  = the first major release that could break us
#
#  This is the correct way to express "we need at least X, but we are
#  not prepared for the next major version". It gives pip room to pick
#  up patch and minor fixes (including security fixes) without ever
#  silently jumping to a breaking major.
#
#  Order is alphabetical so diffs are readable.
# ---------------------------------------------------------------------
dependencies = [
    "alembic>=1.15.0,<2.0.0",
    "asyncpg>=0.30.0,<0.31.0",
    "fastapi>=0.115.0,<1.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
]


# ---------------------------------------------------------------------
#  Optional Dependency Groups
#
#  Split into two groups by INTENT, not by convenience:
#
#    dev  = tools a developer runs locally (linters, formatters,
#           type checkers, hot-reload helpers). Never installed on a
#           production host.
#
#    test = tools that a CI runner or a test host needs to execute
#           the test suite. Includes dev group so `pip install .[test]`
#           is a single command.
#
#  The old file had only `test`. Production never needs pytest, but
#  CI does; and developers need ruff/mypy but CI may only need pytest.
#  Keeping them separate lets each environment install exactly what
#  it needs and nothing more.
# ---------------------------------------------------------------------
[project.optional-dependencies]
dev = [
    "ruff>=0.6.0,<1.0.0",
    "mypy>=1.11.0,<2.0.0",
    "types-setuptools>=69.0.0",
]
test = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "httpx>=0.27.0,<1.0.0",
]


# ---------------------------------------------------------------------
#  Entry Points
#
#  Allows `origin-hub-api` to be run as a console script once
#  installed, which is what production supervisors should invoke
#  rather than calling uvicorn directly. That way the entry point is
#  versioned with the code instead of living in a batch file.
# ---------------------------------------------------------------------
[project.scripts]
origin-hub-api = "app.__main__:main"


# ---------------------------------------------------------------------
#  Package Discovery
#
#  Explicitly exclude tests and tooling from the shipped wheel. The
#  old config included everything under "app*" but did not say what
#  NOT to include, which means a future top-level directory named
#  `app_debug` would silently end up in production.
# ---------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "docs*", "scripts*"]


# ---------------------------------------------------------------------
#  Package Data
#
#  Non-Python files that must travel with the package: Alembic
#  migration templates, SQL files, Jinja templates, py.typed marker.
#  Without this section, `pip install .` produces a wheel that is
#  missing everything except .py files, and the app breaks on the
#  first migration or template render.
# ---------------------------------------------------------------------
[tool.setuptools.package-data]
app = [
    "py.typed",
    "**/*.sql",
    "**/*.j2",
    "**/*.html",
    "**/*.json",
]


# =====================================================================
#  Tooling Configuration
#  Kept in this file so that CI, pre-commit hooks, editors, and
#  developers all read the same settings from the same place.
# =====================================================================


# ---------------------------------------------------------------------
#  pytest
#  testpaths keeps pytest from wandering into site-packages when
#  invoked bare. pythonpath makes `from app.main import app` work
#  without an editable install. asyncio_mode=auto means async test
#  functions do not need an explicit decorator on every one.
# ---------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
]
markers = [
    "slow: tests that take more than a couple of seconds",
    "integration: tests that require external services (db, cache)",
]


# ---------------------------------------------------------------------
#  coverage
#  Omit the usual boilerplate so the coverage number reflects real
#  application code.
# ---------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/__main__.py",
    "*/tests/*",
    "*/migrations/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]


# ---------------------------------------------------------------------
#  ruff
#  One linter + formatter instead of flake8 + isort + black + pyupgrade.
#  Configured to match the project's Python floor (3.10) so it will
#  never suggest syntax the runtime cannot execute.
# ---------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "S",         # bandit
    "ASYNC",     # flake8-async
    "RUF",       # ruff-specific
]
ignore = [
    "S101",      # allow assert in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


# ---------------------------------------------------------------------
#  mypy
#  Strict mode is the only mode that catches the bugs you actually
#  care about. Applied to app/ only; tests get a looser config so we
#  do not fight the type checker inside fixtures.
# ---------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false